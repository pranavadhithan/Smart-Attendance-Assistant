<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Assistant</title>
    <style>
        /* Recreates the sharp diagonal split theme from your image */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Matches the precise blue and yellow angular color block ratio */
            background: linear-gradient(135deg, #1b4f72 0%, #2874a6 50%, #f4d03f 50%, #f1c40f 100%);
            background-size: cover;
        }

        /* Centered login dashboard card module container */
        .portal-container {
            background-color: #ffffff;
            padding: 45px 40px;
            border-radius: 16px;
            /* Deep smooth drop shadows for premium realism elevation */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: #7f8c8d;
            margin-bottom: 35px;
            font-size: 15px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Clean interactive anchor portal block controls */
        .portal-block {
            display: block;
            padding: 16px 20px;
            /* Solid corporate navy blue buttons to overlay cleanly */
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(44, 62, 80, 0.15);
        }

        /* Hover action handling */
        .portal-block:hover {
            background-color: #34495e;
            transform: translateY(-2px); /* Seamlessly lifts up slightly */
            box-shadow: 0 6px 12px rgba(44, 62, 80, 0.3);
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <h2>Smart Attendance Assistant</h2>
        <p>Please select your login portal:</p>
        
        <div class="button-group">
            <a href="/login/student" class="portal-block">Student Portal</a>
            <a href="/login/teacher" class="portal-block">Teacher Portal</a>
            <a href="/login/admin" class="portal-block">Admin Portal</a>
        </div>
    </div>

</body>
</html>
